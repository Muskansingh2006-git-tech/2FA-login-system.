
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Registration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #071b16, #123c2e, #071b16);
        }

        .container {
            width: 360px;
            padding: 35px;
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.4);
        }

        h2 {
            text-align: center;
            color: #123c2e;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 7px;
            outline: none;
        }

        input:focus {
            border-color: #15966b;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #15966b;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0d704e;
        }

        .message {
            color: #2fd348 !important;
            text-align: center;
            margin-bottom: 12px;
        }

        .login {
            margin-top: 20px;
            font-size: 14px;
        }

        a {
            color: #15966b;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Create Account</h2>
        <p>Secure Login System with 2FA</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">

            <label>Username / Email</label>
            <input type="text" name="username"
                   placeholder="Enter your username" required>

            <label>Password</label>
            <input type="password" name="password"
                   placeholder="Minimum 8 characters"
                   minlength="8" required>

            <button type="submit">Register</button>

        </form>

        <div class="login">
            Already have an account?
            <a href="/login">Login</a>
        </div>

    </div>

</body>
</html>
